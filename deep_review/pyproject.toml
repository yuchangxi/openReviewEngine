[project]
name = "deep-review"
version = "0.0.1"
description = "Tier-2 deep, multi-agent code review engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "openai>=3.35,<4",
    "pydantic>=2.9,<3",
]

[project.scripts]
deep_review = "deep_review.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: needs internet access (clones a public GitHub repository); run with -m network",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Prompt prose: rewrapping would change the exact text sent to the model (and break replays).
"src/deep_review/prompts/*" = ["E501"]
